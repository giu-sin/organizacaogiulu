const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const brandsMap={};
DATA.forEach(r=>{ const k=r.marca; (brandsMap[k]=brandsMap[k]||{marca:k,grupo:r.grupo,seg:r.seg,linha:r.linha,emb:[],aon:[]});
  (r.papel==='EMBAIXADOR'?brandsMap[k].emb:brandsMap[k].aon).push(r); });
const brands=Object.values(brandsMap).sort((a,b)=> (a.grupo+a.marca).localeCompare(b.grupo+b.marca));
const grupos=[...new Set(DATA.map(r=>r.grupo))];
let activeGrupo=null, activeBrand=null;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mark(t,q){ if(!q)return esc(t); const i=norm(t).indexOf(norm(q)); if(i<0)return esc(t); return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length)); }
function chip(r,q){ const cls=r.papel==='EMBAIXADOR'?'pchip embx':'pchip';
  const label=r.nome?mark(r.nome,q):('@'+mark(r.h,q));
  const arrow=r.url?' <span class="ig">↗</span>':'';
  const inner=label+arrow;
  const title=r.h?('@'+r.h):'';
  return r.url?('<a class="'+cls+'" title="'+esc(title)+'" href="'+r.url+'" target="_blank" rel="noopener">'+inner+'</a>'):('<span class="'+cls+'" title="'+esc(title)+'">'+inner+'</span>'); }
function matchRow(r,nq){ return norm(r.nome).includes(nq)||norm(r.h).includes(nq); }
function render(){
  const q=document.getElementById('q').value.trim(); const nq=norm(q);
  let list=brands;
  if(activeGrupo) list=list.filter(b=>b.grupo===activeGrupo);
  if(activeBrand) list=list.filter(b=>b.marca===activeBrand);
  if(nq) list=list.filter(b=> norm(b.marca).includes(nq)||norm(b.seg).includes(nq)||b.emb.concat(b.aon).some(r=>matchRow(r,nq)) );
  const res=document.getElementById('results');
  document.getElementById('empty').style.display=list.length?'none':'block';
  res.innerHTML=list.map(b=>{
    let emb=b.emb, aon=b.aon;
    const brandMatches = nq && (norm(b.marca).includes(nq)||norm(b.seg).includes(nq));
    if(nq && !brandMatches){ emb=b.emb.filter(r=>matchRow(r,nq)); aon=b.aon.filter(r=>matchRow(r,nq)); }
    const embHtml=emb.length?('<div class="seclabel"><span class="emb">★</span> Embaixador'+(emb.length>1?'es':'')+'</div><div class="people">'+emb.map(r=>chip(r,nq)).join('')+'</div>'):'';
    const aonHtml=aon.length?('<div class="seclabel">AON · '+aon.length+'</div><div class="people">'+aon.map(r=>chip(r,nq)).join('')+'</div>'):'';
    return '<div class="mcard"><div class="mtitle"><span class="mn">'+mark(b.marca,nq)+'</span><span class="segtag">'+esc(b.seg)+'</span><span class="gtag">'+esc(b.grupo)+'</span></div><div class="mline">Linha: '+esc(b.linha||'—')+'</div>'+embHtml+aonHtml+'</div>';
  }).join('');
}
function buildGrupos(){
  const c=document.getElementById('grupos');
  c.innerHTML='<span class="fchip gchip'+(activeGrupo?'':' on')+'" onclick="setGrupo(null)">Todos</span>'+
    grupos.map(g=>'<span class="fchip gchip'+(activeGrupo===g?' on':'')+'" onclick="setGrupo(\''+g.replace(/'/g,"\\'")+'\')">'+esc(g)+'</span>').join('');
}
function buildChips(){
  const c=document.getElementById('chips');
  let bs=brands; if(activeGrupo) bs=bs.filter(b=>b.grupo===activeGrupo);
  c.innerHTML='<span class="fchip'+(activeBrand?'':' on')+'" onclick="setBrand(null)">Todas</span>'+
    bs.map(b=>'<span class="fchip'+(activeBrand===b.marca?' on':'')+'" onclick="setBrand(\''+b.marca.replace(/'/g,"\\'")+'\')">'+esc(b.marca)+'</span>').join('');
}
function setGrupo(g){ activeGrupo=g; activeBrand=null; document.getElementById('q').value=''; buildGrupos(); buildChips(); render(); }
function setBrand(m){ activeBrand=m; document.getElementById('q').value=''; buildChips(); render(); }
document.getElementById('kpis').innerHTML='<span><b>'+brands.length+'</b> marcas</span><span><b>'+grupos.length+'</b> clientes</span><span><b>'+DATA.filter(r=>r.papel==='EMBAIXADOR').length+'</b> embaixadores</span><span><b>'+DATA.length+'</b> vínculos</span>';
document.getElementById('q').addEventListener('input',()=>{ if(activeGrupo||activeBrand){activeGrupo=null;activeBrand=null;buildGrupos();buildChips();} render(); });
buildGrupos(); buildChips(); render();
</script>
