  if(nq) list=list.filter(b=> norm(b.marca).includes(nq) || norm(b.seg).includes(nq) || norm(b.linha).includes(nq) || b.emb.concat(b.aon).some(r=>norm(r.h).includes(nq)));
  const res=document.getElementById('results');
  document.getElementById('empty').style.display=list.length?'none':'block';
  res.innerHTML=list.map(b=>{
    // se busca por influ, mostra só quem casa
    let emb=b.emb, aon=b.aon;
    if(nq && !norm(b.marca).includes(nq) && !norm(b.seg).includes(nq) && !norm(b.linha).includes(nq)){
      emb=b.emb.filter(r=>norm(r.h).includes(nq)); aon=b.aon.filter(r=>norm(r.h).includes(nq));
    }
    const embHtml=emb.length?('<div class="seclabel"><span class="emb">★</span> Embaixador'+(emb.length>1?'es':'')+'</div><div class="people">'+emb.map(r=>chip(r,nq)).join('')+'</div>'):'';
    const aonHtml=aon.length?('<div class="seclabel">AON · '+aon.length+'</div><div class="people">'+aon.map(r=>chip(r,nq)).join('')+'</div>'):'';
    return '<div class="mcard"><div class="mtitle"><span class="mn">'+mark(b.marca,nq)+'</span><span class="segtag">'+esc(b.seg)+'</span></div><div class="mline">Linha: '+esc(b.linha)+'</div>'+embHtml+aonHtml+'</div>';
  }).join('');
}
function buildChips(){
  const c=document.getElementById('chips');
  c.innerHTML='<span class="fchip'+(activeBrand?'':' on')+'" onclick="setBrand(null)">Todas</span>'+
    brands.map(b=>'<span class="fchip'+(activeBrand===b.marca?' on':'')+'" onclick="setBrand(\''+b.marca.replace(/'/g,"\\'")+'\')">'+esc(b.marca)+'</span>').join('');
}
function setBrand(m){ activeBrand=m; document.getElementById('q').value=''; buildChips(); render(); }
document.getElementById('kpis').innerHTML='<span><b>'+brands.length+'</b> marcas</span><span><b>'+DATA.filter(r=>r.papel==='EMBAIXADOR').length+'</b> embaixadores</span><span><b>'+DATA.length+'</b> vínculos</span>';
document.getElementById('q').addEventListener('input',()=>{ if(activeBrand){activeBrand=null;buildChips();} render(); });
buildChips(); render();
</script>
</body>
</html>
